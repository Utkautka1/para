# Control plane Tailscale (долгий long-poll) провайдер рвёт DPI — ходим через claude
# (para-socks-claude.service, ssh -D 127.0.0.1:1080).
# DERP-релеи работают напрямую, а через SOCKS не умеют (tailscaled шлёт им HTTP CONNECT),
# поэтому все derpN*.tailscale.com исключены из прокси. NO_PROXY не поддерживает маски вида derp*.
