<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>para — Портал 1-КПД-3 • Рейтинг и Ачивки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --gold: #f59e0b;
      --silver: #94a3b8;
      --bronze: #d97706;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 24px;
    }

    .header-bar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .badge-dev { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-gold { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseAnim 2s infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Tabs Navigation */
    .tabs-nav {
      display: flex;
      background: rgba(18, 24, 38, 0.95);
      padding: 6px 10px;
      gap: 6px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 49px;
      z-index: 999;
      backdrop-filter: blur(14px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(79, 70, 229, 0.4) 100%);
      color: #ffffff;
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.25);
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* Podium Top-3 */
    .podium-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 24px;
      padding-top: 10px;
    }
    .podium-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 16px 8px;
      text-align: center;
      position: relative;
      transition: transform 0.2s;
    }
    .podium-card:hover { transform: translateY(-3px); }
    .podium-1 {
      order: 2;
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.2);
      transform: scale(1.05);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.12) 0%, var(--card-bg) 100%);
    }
    .podium-2 {
      order: 1;
      border-color: rgba(148, 163, 184, 0.4);
      box-shadow: 0 0 15px rgba(148, 163, 184, 0.15);
    }
    .podium-3 {
      order: 3;
      border-color: rgba(217, 119, 6, 0.4);
      box-shadow: 0 0 15px rgba(217, 119, 6, 0.15);
    }
    .podium-crown { font-size: 24px; margin-bottom: 4px; }
    .podium-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    .podium-pct { font-size: 14px; font-weight: 800; color: #10b981; }
    .podium-xp { font-size: 11px; color: #fbbf24; font-weight: 600; margin-top: 2px; }

    /* Student List */
    .list-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 4px 10px 4px;
      display: flex;
      justify-content: space-between;
    }
    .student-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.15s;
      cursor: pointer;
    }
    .student-item:hover { background: rgba(30, 41, 59, 0.8); transform: translateX(2px); }
    .student-rank-num { font-weight: 800; font-size: 13px; width: 22px; color: var(--text-muted); }
    .student-info { flex: 1; }
    .student-name-row { display: flex; align-items: center; gap: 6px; }
    .student-fio { font-weight: 600; font-size: 13px; }
    .student-rank-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 600;
    }
    .student-stats-row { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .student-right { text-align: right; }
    .student-pct-val { font-size: 14px; font-weight: 800; color: #34d399; }
    .student-xp-val { font-size: 11px; color: #fbbf24; font-weight: 600; }

    /* Achievements Grid */
    .ach-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .ach-filters::-webkit-scrollbar { display: none; }
    .ach-filter-btn {
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ach-filter-btn.active {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.6);
      color: #fff;
    }
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
    }
    .ach-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      backdrop-filter: blur(14px);
      transition: all 0.2s;
    }
    .ach-card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.2); }
    .ach-icon { font-size: 28px; margin-bottom: 6px; }
    .ach-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; line-height: 1.2; }
    .ach-desc { font-size: 10px; color: var(--text-muted); line-height: 1.3; min-height: 38px; }
    .ach-footer { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
    .rarity-pill {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .rarity-common { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .rarity-rare { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .rarity-epic { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
    .rarity-legendary { background: rgba(245, 158, 11, 0.25); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.5); }

    /* Profile View */
    .profile-hero {
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.15) 0%, var(--card-bg) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
      margin-bottom: 18px;
      backdrop-filter: blur(16px);
    }
    .profile-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      margin: 0 auto 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }
    .profile-name { font-size: 18px; font-weight: 800; }
    .profile-rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .profile-xp-box { margin-top: 14px; font-size: 13px; color: var(--text-muted); }
    .xp-bar-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 8px;
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }
    .xp-bar-fill {
      background: linear-gradient(90deg, #6366f1, #34d399);
      height: 100%;
      width: 75%;
      border-radius: 4px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .stat-mini-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
    }
    .stat-mini-val { font-size: 16px; font-weight: 800; }
    .stat-mini-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* Swagger & Jaeger Views (Strictly hidden for students) */
    #swagger-wrapper, #jaeger-wrapper { display: none; width: 100%; }
    .swagger-ui .info .url { display: none !important; }
    .jaeger-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(18, 24, 38, 0.95);
      border-bottom: 1px solid var(--card-border);
    }
    #jaeger-frame { width: 100%; height: calc(100vh - 120px); border: none; background: #fff; }
    .filter-chip {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-weight:800; font-size:15px; letter-spacing:-0.02em;">🎓 1-КПД-3</span>
      <span class="badge badge-gold">v2.9.0 • 300 Releases</span>
    </div>
    <div class="badge badge-dev">
      <span class="pulse"></span>
      <span id="group-pulse-lbl">Пульс: 75%</span>
    </div>
  </div>

  <div id="app-tabs" class="tabs-nav">
    <button class="tab-btn active" id="tab-leaderboard" onclick="switchTab('leaderboard')">
      <span>🏆 Рейтинг</span>
    </button>
    <button class="tab-btn" id="tab-achievements" onclick="switchTab('achievements')">
      <span>🎖️ Ачивки (80)</span>
    </button>
    <button class="tab-btn" id="tab-profile" onclick="switchTab('profile')">
      <span>👤 Профиль</span>
    </button>
    <!-- Hidden by default for students; shown only to admin & testers -->
    <button class="tab-btn" id="tab-swagger" style="display:none !important;" onclick="switchTab('swagger')">
      <span>⚡ Swagger UI</span>
    </button>
    <button class="tab-btn" id="tab-jaeger" style="display:none !important;" onclick="switchTab('jaeger')">
      <span>🔍 Jaeger Traces</span>
    </button>
  </div>

  <!-- LEADERBOARD TAB (DEFAULT FOR ALL CLASSMATES) -->
  <div id="leaderboard-view" class="container">
    <div class="podium-wrap" id="podium-container">
      <!-- Top 3 dynamically injected -->
    </div>

    <div class="list-title">
      <span>Все студенты (26)</span>
      <span style="font-weight:600; color:#a5b4fc;">Посещаемость & XP</span>
    </div>
    <div id="students-list">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">Загрузка рейтинга 1-КПД-3... ⏳</div>
    </div>
  </div>

  <!-- ACHIEVEMENTS TAB -->
  <div id="achievements-view" class="container" style="display:none;">
    <div class="ach-filters" id="ach-categories">
      <button class="ach-filter-btn active" onclick="filterCategory('all')">Все (80)</button>
      <button class="ach-filter-btn" onclick="filterCategory('attendance')">Посещаемость</button>
      <button class="ach-filter-btn" onclick="filterCategory('punctuality')">Пунктуальность</button>
      <button class="ach-filter-btn" onclick="filterCategory('bot_interaction')">Бот</button>
      <button class="ach-filter-btn" onclick="filterCategory('ai_homework')">ИИ и ДЗ</button>
      <button class="ach-filter-btn" onclick="filterCategory('student_life')">Студ. жизнь</button>
      <button class="ach-filter-btn" onclick="filterCategory('social')">Социалка</button>
      <button class="ach-filter-btn" onclick="filterCategory('easter_eggs')">Пасхалки</button>
      <button class="ach-filter-btn" onclick="filterCategory('mastery')">Мастерство</button>
    </div>
    <div class="ach-grid" id="achievements-container">
      <!-- 80 achievements injected -->
    </div>
  </div>

  <!-- PROFILE TAB -->
  <div id="profile-view" class="container" style="display:none;">
    <div class="profile-hero" id="profile-hero-content">
      <div class="profile-avatar">🎓</div>
      <div class="profile-name" id="prof-fio">Студент 1-КПД-3</div>
      <div class="profile-rank-badge" id="prof-rank">👑 Любимчик старосты</div>
      <div class="profile-xp-box">
        <div style="display:flex; justify-content:space-between; font-weight:600;">
          <span id="prof-xp-val">1,450 XP</span>
          <span style="color:#a5b4fc;">Уровень 5</span>
        </div>
        <div class="xp-bar-bg"><div class="xp-bar-fill"></div></div>
      </div>
      <div class="stats-grid">
        <div class="stat-mini-card">
          <div class="stat-mini-val" style="color:#10b981;" id="prof-pct">100%</div>
          <div class="stat-mini-lbl">Посещаемость</div>
        </div>
        <div class="stat-mini-card">
          <div class="stat-mini-val" id="prof-p">0</div>
          <div class="stat-mini-lbl">Присутствовал</div>
        </div>
        <div class="stat-mini-card">
          <div class="stat-mini-val" style="color:#f59e0b;" id="prof-o">0</div>
          <div class="stat-mini-lbl">Опозданий</div>
        </div>
        <div class="stat-mini-card">
          <div class="stat-mini-val" style="color:#ef4444;" id="prof-n">0</div>
          <div class="stat-mini-lbl">Прогулов</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SWAGGER TAB (ONLY TESTERS) -->
  <div id="swagger-wrapper">
    <div id="swagger-ui"></div>
  </div>

  <!-- JAEGER TAB (ONLY TESTERS) -->
  <div id="jaeger-wrapper">
    <div class="jaeger-toolbar">
      <span style="font-size:12px; font-weight:600; color:var(--text-muted);">Быстрый фильтр:</span>
      <button class="filter-chip" onclick="filterJaegerService('para-bot')">para-bot</button>
      <button class="filter-chip" onclick="filterJaegerService('para-worker')">para-worker</button>
      <button class="filter-chip" onclick="filterJaegerService('para-api')">para-api</button>
    </div>
    <iframe id="jaeger-frame" src=""></iframe>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0b0f19');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0f19');
    }

    let allAchievements = [];
    let currentTab = 'leaderboard';
    let isTester = false;
    let jaegerLoaded = false;
    let swaggerLoaded = false;

    async function loadLeaderboard() {
      try {
        const resp = await fetch('/gamification/leaderboard');
        if (!resp.ok) return;
        const data = await resp.json();
        document.getElementById('group-pulse-lbl').innerText = `Пульс: ${data.group_pulse}%`;
        renderPodium(data.leaderboard.slice(0, 3));
        renderStudentsList(data.leaderboard);
        if (data.leaderboard.length > 0) renderProfile(data.leaderboard[0]);
      } catch (e) {
        console.error('Ошибка загрузки лидерборда:', e);
      }
    }

    function renderPodium(top3) {
      if (top3.length < 3) return;
      const html = `
        <div class="podium-card podium-2">
          <div class="podium-crown">🥈</div>
          <div class="podium-name">${escapeHtml(top3[1].short_fio)}</div>
          <div class="podium-pct">${top3[1].attendance_pct}%</div>
          <div class="podium-xp">${top3[1].xp} XP</div>
        </div>
        <div class="podium-card podium-1">
          <div class="podium-crown">👑 🥇</div>
          <div class="podium-name">${escapeHtml(top3[0].short_fio)}</div>
          <div class="podium-pct">${top3[0].attendance_pct}%</div>
          <div class="podium-xp">${top3[0].xp} XP</div>
        </div>
        <div class="podium-card podium-3">
          <div class="podium-crown">🥉</div>
          <div class="podium-name">${escapeHtml(top3[2].short_fio)}</div>
          <div class="podium-pct">${top3[2].attendance_pct}%</div>
          <div class="podium-xp">${top3[2].xp} XP</div>
        </div>
      `;
      document.getElementById('podium-container').innerHTML = html;
    }

    function renderStudentsList(list) {
      const container = document.getElementById('students-list');
      const itemsHtml = list.map((s, idx) => {
        const num = idx + 1;
        const rankColor = s.attendance_pct >= 95 ? '#10b981' : (s.attendance_pct >= 70 ? '#fbbf24' : '#ef4444');
        return `
          <div class="student-item" onclick="renderProfile(${JSON.stringify(s).replace(/"/g, '&quot;')}); switchTab('profile');">
            <div class="student-rank-num">${num}</div>
            <div class="student-info">
              <div class="student-name-row">
                <span class="student-fio">${escapeHtml(s.short_fio)}</span>
                <span class="student-rank-pill">${s.rank_icon} ${escapeHtml(s.rank_name)}</span>
              </div>
              <div class="student-stats-row">
                П: ${s.present_count} • О: ${s.late_count} • У: ${s.excused_count} • Н: ${s.unexcused_count}
              </div>
            </div>
            <div class="student-right">
              <div class="student-pct-val" style="color:${rankColor}">${s.attendance_pct}%</div>
              <div class="student-xp-val">${s.xp} XP</div>
            </div>
          </div>
        `;
      }).join('');
      container.innerHTML = itemsHtml;
    }

    async function loadAchievements() {
      try {
        const resp = await fetch('/gamification/achievements');
        if (!resp.ok) return;
        const data = await resp.json();
        allAchievements = data.achievements;
        renderAchievements(allAchievements);
      } catch (e) {
        console.error('Ошибка загрузки ачивок:', e);
      }
    }

    function renderAchievements(achs) {
      const container = document.getElementById('achievements-container');
      container.innerHTML = achs.map(a => `
        <div class="ach-card">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-title">${escapeHtml(a.title)}</div>
          <div class="ach-desc">${escapeHtml(a.description)}</div>
          <div class="ach-footer">
            <span class="rarity-pill rarity-${a.rarity}">${a.rarity}</span>
            <span style="color:#fbbf24; font-weight:700;">+${a.xp_reward} XP</span>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      const btns = document.querySelectorAll('.ach-filter-btn');
      btns.forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'all') {
        renderAchievements(allAchievements);
      } else {
        renderAchievements(allAchievements.filter(a => a.category === cat));
      }
    }

    function renderProfile(student) {
      document.getElementById('prof-fio').innerText = student.fio;
      document.getElementById('prof-rank').innerText = `${student.rank_icon} ${student.rank_name}`;
      document.getElementById('prof-xp-val').innerText = `${student.xp} XP`;
      document.getElementById('prof-pct').innerText = `${student.attendance_pct}%`;
      document.getElementById('prof-p').innerText = student.present_count;
      document.getElementById('prof-o').innerText = student.late_count;
      document.getElementById('prof-n').innerText = student.unexcused_count;
    }

    function switchTab(tab) {
      if ((tab === 'swagger' || tab === 'jaeger') && !isTester) {
        console.warn('Доступ запрещен: панель доступна только администратору и тестерам.');
        return;
      }
      currentTab = tab;
      const tabs = ['leaderboard', 'achievements', 'profile', 'swagger', 'jaeger'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab-' + t);
        const view = document.getElementById(t + '-view') || document.getElementById(t + '-wrapper');
        if (btn) btn.classList.toggle('active', t === tab);
        if (view) view.style.display = (t === tab) ? (t === 'jaeger' ? 'flex' : 'block') : 'none';
      });

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (tab === 'swagger' && !swaggerLoaded) initSwagger();
      if (tab === 'jaeger' && !jaegerLoaded) {
        document.getElementById('jaeger-frame').src = '/jaeger/';
        jaegerLoaded = true;
      }
    }

    function filterJaegerService(svc) {
      const frame = document.getElementById('jaeger-frame');
      if (frame) {
        frame.src = '/jaeger/search?service=' + encodeURIComponent(svc);
        jaegerLoaded = true;
      }
    }

    function initSwagger() {
      swaggerLoaded = true;
      const CleanSwaggerPlugin = () => ({
        wrapComponents: {
          InfoUrl: () => () => null
        }
      });

      SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        plugins: [CleanSwaggerPlugin],
        layout: "BaseLayout",
        requestInterceptor: (req) => {
          req.credentials = 'include';
          if (req.url) {
            req.url = req.url.replace(/^https?:\/\/[^\/]+/, '');
          }
          return req;
        }
      });

      const hostSanitizer = new MutationObserver(() => {
        const root = document.getElementById('swagger-ui');
        if (!root) return;
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue && (node.nodeValue.includes('45-81-154-175') || node.nodeValue.includes('sslip.io'))) {
            node.nodeValue = node.nodeValue.replace(/https?:\/\/45[-.]81[-.]154[-.]175[^\/\s'"]*/g, '');
          }
        }
      });
      hostSanitizer.observe(document.getElementById('swagger-ui'), { childList: true, subtree: true, characterData: true });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function checkTesterRole() {
      try {
        const initData = tg && tg.initData ? tg.initData : new URLSearchParams(window.location.search).get('init_data') || '';
        let authorized = false;
        if (initData) {
          const resp = await fetch('/miniapp/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ init_data: initData })
          });
          if (resp.ok) authorized = true;
        }
        if (!authorized) {
          const stResp = await fetch('/miniapp/status');
          if (stResp.ok) {
            const st = await stResp.json();
            if (st.authenticated && st.is_tester) authorized = true;
          }
        }
        if (authorized) {
          isTester = true;
          const btnSw = document.getElementById('tab-swagger');
          const btnJg = document.getElementById('tab-jaeger');
          if (btnSw) btnSw.style.setProperty('display', 'inline-flex', 'important');
          if (btnJg) btnJg.style.setProperty('display', 'inline-flex', 'important');
        }
      } catch (e) {
        isTester = false;
      }
    }

    loadLeaderboard();
    loadAchievements();
    checkTesterRole();
  </script>
</body>
</html>
