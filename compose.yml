# Трейсы всех сервисов идут в OTel Collector, а не напрямую в Jaeger: коллектор считает
# RED-метрики по 100% спанов и сам отбирает 10% трейсов для Jaeger (observability/otel-collector.yaml).
# Значения здесь важнее .env — сэмплирование в SDK занизило бы метрики вкладки Monitor.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SAMPLING_RATIO: "1.0"

services:
  redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: always
    # Пароль отдаём redis-server через stdin-конфиг ("-"), а не флагом --requirepass:
    # иначе он виден в `docker inspect` (Args) и `ps` на хосте.
    # Через docker-entrypoint.sh — чтобы сохранить сброс прав до пользователя redis (gosu).
    # REDISCLI_AUTH остаётся в env: его читают healthcheck и `docker exec para-redis redis-cli`.
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - --appendonly yes --maxmemory 48M --maxmemory-policy volatile-lru <<EOF
        requirepass "$$REDISCLI_AUTH"
        EOF
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: para-jaeger
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      # Вкладка Monitor (SPM): RED-метрики spanmetrics из Prometheus
      - METRICS_STORAGE_TYPE=prometheus
      - PROMETHEUS_SERVER_URL=http://prometheus:9090
      - PROMETHEUS_QUERY_NAMESPACE=traces_span_metrics
      - PROMETHEUS_QUERY_NORMALIZE_CALLS=true
      - PROMETHEUS_QUERY_NORMALIZE_DURATION=true
    command: ["--query.base-path=/jaeger"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1@sha256:d2da12c4336a79758826700be9e21ecf4a9f7d945b7f8a58ba55ee3fa45427c8
    container_name: para-otel-collector
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.50'
        reservations:
          memory: 48M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: para-prometheus
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Хранит только метрики spanmetrics; 15 дней хватает для графиков Monitor
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Именованный том, а не ./data: Prometheus пишет от nobody, а ./data принадлежит root
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  api:
    image: para-api:latest
    build:
      context: .
      dockerfile: api.dockerfile
    container_name: para-api
    restart: always
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - .env
    environment:
      <<: *otel-env
    volumes:
      - ./integrations:/app/integrations:ro
      - ./api:/app/api:ro
      - ./core:/app/core:ro
      - ./services:/app/services:ro
      - ./utils:/app/utils:ro
      - ./db:/app/db:ro
      - ./config.py:/app/config.py:ro
      - ./api.py:/app/api.py:ro
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: para-bot:latest
    build:
      context: .
      dockerfile: bot.dockerfile
    container_name: para-bot
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    # Секреты, которые боту не нужны: config.py требует их при импорте, поэтому подменяем заглушкой
    environment:
      <<: *otel-env
      DEEPSEEK_API_KEY: "disabled:not-used-by-this-service"
      SESSION_SECRET: "disabled:not-used-by-this-service"
    volumes:
      - ./api:/app/api:ro
      - ./integrations:/app/integrations:ro
      - ./bot:/app/bot:ro
      - ./core:/app/core:ro
      - ./services:/app/services:ro
      - ./utils:/app/utils:ro
      - ./db:/app/db:ro
      - ./config.py:/app/config.py:ro
      - ./bot.py:/app/bot.py:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - stt_audio:/app/stt_audio
    deploy:
      resources:
        # Модель Whisper и GPU переехали в сервис stt — боту хватает 1 ГБ
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: para-worker:latest
    build:
      context: .
      dockerfile: worker.dockerfile
    container_name: para-worker
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    # Секреты, которые worker не нужны (см. bot)
    environment:
      <<: *otel-env
      DEEPSEEK_API_KEY: "disabled:not-used-by-this-service"
      SESSION_SECRET: "disabled:not-used-by-this-service"
    volumes:
      - ./api:/app/api:ro
      - ./bot:/app/bot:ro
      - ./integrations:/app/integrations:ro
      - ./core:/app/core:ro
      - ./services:/app/services:ro
      - ./utils:/app/utils:ro
      - ./db:/app/db:ro
      - ./config.py:/app/config.py:ro
      - ./worker.py:/app/worker.py:ro
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  solver:
    image: para-solver:latest
    build:
      context: .
      dockerfile: solver.dockerfile
    container_name: para-solver
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    # Solver нужны только BOT_TOKEN (ответы в топик) и DEEPSEEK_API_KEY
    environment:
      <<: *otel-env
      API_SECRET_KEY: "disabled:not-used-by-this-service"
      SESSION_SECRET: "disabled:not-used-by-this-service"
      YANDEX_COOKIE: "disabled:not-used-by-this-service"
    volumes:
      # Код монтируется, как у остальных сервисов: деплой = git pull + restart, без пересборки образа
      - ./core:/app/core:ro
      - ./services:/app/services:ro
      - ./integrations:/app/integrations:ro
      - ./utils:/app/utils:ro
      - ./config.py:/app/config.py:ro
      - ./solver.py:/app/solver.py:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  stt:
    image: para-stt:latest
    build:
      context: .
      dockerfile: stt.dockerfile
    container_name: para-stt
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    # STT разбирает чужое аудио (ffmpeg) и ходит только в Redis — секреты ему не отдаём
    environment:
      <<: *otel-env
      BOT_TOKEN: "disabled:not-used-by-this-service"
      API_SECRET_KEY: "disabled:not-used-by-this-service"
      SESSION_SECRET: "disabled:not-used-by-this-service"
      DEEPSEEK_API_KEY: "disabled:not-used-by-this-service"
      YANDEX_COOKIE: "disabled:not-used-by-this-service"
    volumes:
      - ./core:/app/core:ro
      - ./services:/app/services:ro
      - ./integrations:/app/integrations:ro
      - ./utils:/app/utils:ro
      - ./db:/app/db:ro
      - ./config.py:/app/config.py:ro
      - ./stt.py:/app/stt.py:ro
      # Из data stt нужны только веса Whisper — остальные данные (БД, кэши, бэкапы) ему не видны
      - ./data/whisper_models:/app/data/whisper_models
      - ./logs:/app/logs
      - stt_audio:/app/stt_audio
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.00'
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Метрики spanmetrics для вкладки Monitor в Jaeger
  prometheus_data:

  # Общий RAM-диск для голосовых между bot (пишет) и stt (читает): без износа диска,
  # права 0700 на uid приложения (1000) — другие процессы хоста файлы не видят
  stt_audio:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=1000,gid=1000,mode=0700"
