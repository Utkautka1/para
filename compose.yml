services:
  redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 48M
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: para-jaeger
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    command: ["--query.base-path=/jaeger"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  api:
    image: para-api:latest
    build:
      context: .
      dockerfile: api.dockerfile
    container_name: para-api
    restart: always
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: para-bot:latest
    build:
      context: .
      dockerfile: bot.dockerfile
    container_name: para-bot
    restart: always
    stop_grace_period: 10s
    shm_size: '512m'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.00'
        reservations:
          memory: 256M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: para-worker:latest
    build:
      context: .
      dockerfile: worker.dockerfile
    container_name: para-worker
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  solver:
    image: para-solver:latest
    build:
      context: .
      dockerfile: solver.dockerfile
    container_name: para-solver
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
