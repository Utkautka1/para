services:
  mongo:
    image: mongo:7.0
    container_name: para-mongo
    restart: always
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27018:27017"
    volumes:
      - ./data/mongo:/data/db
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M

  bot:
    build:
      context: .
      dockerfile: bot.dockerfile
    container_name: para-bot
    restart: always
    depends_on:
      - redis
      - mongo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 96M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  parser:
    build:
      context: .
      dockerfile: parser.dockerfile
    container_name: para-parser
    restart: always
    depends_on:
      - redis
      - mongo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: scheduler.dockerfile
    container_name: para-scheduler
    restart: always
    depends_on:
      - redis
      - mongo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 96M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  solver:
    build:
      context: .
      dockerfile: solver.dockerfile
    container_name: para-solver
    restart: always
    depends_on:
      - redis
      - mongo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    container_name: para-dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: para-redis-commander
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  mongo-express:
    image: mongo-express:latest
    container_name: para-mongo-express
    restart: always
    depends_on:
      - mongo
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    ports:
      - "8082:8081"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  backup:
    image: mongo:7.0
    container_name: para-backup
    restart: always
    depends_on:
      - mongo
    volumes:
      - ./data/backups:/backups
    command: >
      bash -c 'while true; do
        sleep 86400;
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
        echo "[BACKUP] Создание дампа MongoDB: $$TIMESTAMP";
        mongodump --host mongo:27017 --db para_db --out /backups/dump_$$TIMESTAMP;
        find /backups -maxdepth 2 -type d -mtime +7 -exec rm -rf {} +;
      done'
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
