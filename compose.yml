services:
  redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: always
    # Пароль отдаём redis-server через stdin-конфиг ("-"), а не флагом --requirepass:
    # иначе он виден в `docker inspect` (Args) и `ps` на хосте.
    # Через docker-entrypoint.sh — чтобы сохранить сброс прав до пользователя redis (gosu).
    # REDISCLI_AUTH остаётся в env: его читают healthcheck и `docker exec para-redis redis-cli`.
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - --appendonly yes --maxmemory 48M --maxmemory-policy volatile-lru <<EOF
        requirepass "$$REDISCLI_AUTH"
        EOF
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: para-jaeger
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    command: ["--query.base-path=/jaeger"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  api:
    image: para-api:latest
    build:
      context: .
      dockerfile: api.dockerfile
    container_name: para-api
    restart: always
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - .env
    volumes:
      - ./integrations:/app/integrations
      - ./api:/app/api
      - ./core:/app/core
      - ./services:/app/services
      - ./utils:/app/utils
      - ./db:/app/db
      - ./config.py:/app/config.py
      - ./api.py:/app/api.py
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: para-bot:latest
    build:
      context: .
      dockerfile: bot.dockerfile
    container_name: para-bot
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./api:/app/api
      - ./integrations:/app/integrations
      - ./bot:/app/bot
      - ./core:/app/core
      - ./services:/app/services
      - ./utils:/app/utils
      - ./db:/app/db
      - ./config.py:/app/config.py
      - ./bot.py:/app/bot.py
      - ./data:/app/data
      - ./logs:/app/logs
      - stt_audio:/app/stt_audio
    deploy:
      resources:
        # Модель Whisper и GPU переехали в сервис stt — боту хватает 1 ГБ
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: para-worker:latest
    build:
      context: .
      dockerfile: worker.dockerfile
    container_name: para-worker
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./api:/app/api
      - ./bot:/app/bot
      - ./integrations:/app/integrations
      - ./core:/app/core
      - ./services:/app/services
      - ./utils:/app/utils
      - ./db:/app/db
      - ./config.py:/app/config.py
      - ./worker.py:/app/worker.py
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  solver:
    image: para-solver:latest
    build:
      context: .
      dockerfile: solver.dockerfile
    container_name: para-solver
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Код монтируется, как у остальных сервисов: деплой = git pull + restart, без пересборки образа
      - ./core:/app/core
      - ./services:/app/services
      - ./integrations:/app/integrations
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./solver.py:/app/solver.py
      - ./data:/app/data:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  stt:
    image: para-stt:latest
    build:
      context: .
      dockerfile: stt.dockerfile
    container_name: para-stt
    restart: always
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./core:/app/core
      - ./services:/app/services
      - ./integrations:/app/integrations
      - ./utils:/app/utils
      - ./db:/app/db
      - ./config.py:/app/config.py
      - ./stt.py:/app/stt.py
      # data — веса Whisper (data/whisper_models)
      - ./data:/app/data
      - ./logs:/app/logs
      - stt_audio:/app/stt_audio
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.00'
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Общий RAM-диск для голосовых между bot (пишет) и stt (читает): без износа диска,
  # права 0700 на uid приложения (1000) — другие процессы хоста файлы не видят
  stt_audio:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=1000,gid=1000,mode=0700"
