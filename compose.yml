services:
  redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 48M --maxmemory-policy volatile-lru
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: api.dockerfile
    container_name: para-api
    restart: always
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: bot.dockerfile
    container_name: para-bot
    restart: always
    stop_grace_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: worker.dockerfile
    container_name: para-worker
    restart: always
    stop_grace_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.00'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  solver:
    build:
      context: .
      dockerfile: solver.dockerfile
    container_name: para-solver
    restart: always
    stop_grace_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.00'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
