services:
  redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  para-bot:
    build: .
    container_name: para-bot
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 96M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

