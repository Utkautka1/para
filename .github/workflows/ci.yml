      - name: Install Bandit
        run: pip install bandit
      - name: Scan Business Services
        run: bandit -r services/

  security-pip-audit:
    name: "🔍 Pip-Audit Supply Chain & CVE Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pip-Audit
        run: pip install pip-audit
      - name: Run Vulnerability Audit
        run: pip-audit -r requirements.txt

  security-secrets-leak:
    name: "🔐 Static Secret & API Token Leakage Prevention"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Scan for Leaked Tokens and Private Keys
        run: |
          ! git grep -I -E "AIza[0-9A-Za-z_-]{35}|ghp_[0-9a-zA-Z]{36}|xoxb-[0-9]{11}-[0-9]{11}" -- ':!tests/*'
          ! git grep -I "BEGIN RSA PRIVATE KEY" -- ':!tests/*'
          echo "Zero leaked secrets detected in tracked files."

  security-sqli-ast:
    name: "💉 SQLite Query Sanitization & SQLi Prevention"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AST Audit for Formatted SQL Strings
        run: |
          python3 -c "
          import ast, glob, sys
          violations = []
          for p in glob.glob('db/**/*.py', recursive=True):
              tree = ast.parse(open(p, 'r', encoding='utf-8').read(), filename=p)
              for n in ast.walk(tree):
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == 'execute':
                      if n.args and isinstance(n.args[0], (ast.JoinedStr, ast.BinOp)):
                          violations.append((p, n.lineno))
          if violations:
              print('Unsafe SQL string formatting detected:', violations)
              sys.exit(1)
          print('All database SQL queries parameterized safely!')
          "

  security-cors-csrf:
    name: "🌐 MiniApp CORS, Origin Headers & Security Boundary"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CORS Middleware Configuration
        run: |
          python3 -c "
          from api.main import create_app
          from starlette.middleware.cors import CORSMiddleware
          app = create_app()
          cors_middlewares = [m for m in app.user_middleware if m.cls == CORSMiddleware]
          assert cors_middlewares, 'CORSMiddleware is registered'
          print('Security headers and CORS boundary verified!')
          "

  # =========================================================================
  # 4. Architecture, Documentation Drift & Contracts (Jobs 20-25)
  # =========================================================================
  arch-openapi-drift:
    name: "📄 API Contract Drift Check: OpenAPI Specification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Zero OpenAPI Spec Drift
        run: |
          cp .env.ci .env
          PYTHONPATH=. python3 -c "import json; from api import create_app; open('docs/openapi.json', 'w').write(json.dumps(create_app().openapi(), indent=2) + '\n')"
          git diff --exit-code docs/openapi.json

  arch-docs-suite-drift:
