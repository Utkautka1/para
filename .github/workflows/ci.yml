      - name: "Run Gamification Tests"
        run: cp .env.ci .env && PYTHONPATH=. pytest tests/test_gamification.py -v

  unit-test-miniapp-and-testers:
    name: "🧪 Unit: MiniApp Cryptographic Auth & Tester Whitelist"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
