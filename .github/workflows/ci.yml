          cache: "pip"
      - name: "Verify Relative Links Resolve"
        run: |
          python3 -c "
          import os, re, subprocess, sys
          broken = []
          for f in subprocess.run(['git', 'ls-files', '*.md'], capture_output=True, text=True).stdout.split():
              for link in re.findall(r'\]\(([^)\s]+)\)', open(f, encoding='utf-8').read()):
                  path = link.split('#')[0]
                  if not path or re.match(r'^(https?|mailto):', link):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), path))):
                      broken.append(f'{f} -> {link}')
          if broken:
              print('Broken links:', *broken, sep='\n  ')
              sys.exit(1)
          print('All relative Markdown links resolve')
          "

