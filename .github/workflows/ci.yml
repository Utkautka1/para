          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Scan Core Modules
        run: bandit -r core/

  security-bandit-api:
    name: "🛡️ Bandit AST Security: API Layer"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
