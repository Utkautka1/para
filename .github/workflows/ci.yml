        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Audit Module Docstrings"
        run: |
          python3 -c "
          import ast, subprocess, sys
          files = [f for f in subprocess.run(['git', 'ls-files', '*.py'], capture_output=True, text=True).stdout.split()
                   if not f.startswith('tests/') and '_pb2' not in f]
          missing = [f for f in files if open(f, encoding='utf-8').read().strip()
                     and not ast.get_docstring(ast.parse(open(f, encoding='utf-8').read()))]
          if missing:
              print('Missing module docstring:', *missing, sep='\n  ')
              sys.exit(1)
          print(f'Module docstrings present in {len(files)} files')
          "

