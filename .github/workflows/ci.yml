name: "CI Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Токен по умолчанию только на чтение: скомпрометированный action или пакет из pip
# не сможет сдвинуть ci-passed (по ней сервер деплоит). Запись — только у deploy-gate
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Quality, Style & Formatting (Jobs 1-7)
  # =========================================================================
  check-ruff-lint:
    name: "🎨 Ruff Linter Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Ruff"
        run: pip install ruff
      - name: "Run Ruff Lint"
        run: ruff check .

  check-ruff-format:
    name: "📐 Ruff Formatting Style Inspection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Ruff"
        run: pip install ruff
      - name: "Verify Code Formatting"
        run: ruff format --check .

  check-function-length:
    name: "📏 Single Responsibility Function Length (<= 25 lines)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Audit Function Length in Gamification & Achievement Services"
        run: |
          python3 -c "
          import ast, sys
          targets = ['services/achievement_service.py', 'services/gamification_models.py']
          errors = []
          for path in targets:
              tree = ast.parse(open(path, 'r', encoding='utf-8').read(), filename=path)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      length = node.end_lineno - node.lineno + 1
                      if length > 25:
                          errors.append(f'{path}:{node.name} length={length} exceeds 25 lines')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All target service functions strictly <= 25 lines!')
          "

  check-docstrings-coverage:
    name: "📝 Module & Public Method Docstrings Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Verify Python Module Docstrings"
        run: |
          python3 -c "
          import ast, glob, sys
          missing = []
          for p in glob.glob('services/**/*.py', recursive=True) + glob.glob('core/*.py'):
              if '__init__' in p or 'conftest' in p: continue
              tree = ast.parse(open(p, 'r', encoding='utf-8').read(), filename=p)
              doc = ast.get_docstring(tree)
              if not doc:
                  missing.append(p)
          if missing:
              print('Missing module docstring in:', missing)
              sys.exit(1)
          print('Module docstrings verified across core and services!')
          "

  check-trailing-whitespace:
    name: "🧹 Git Hygiene & Line Endings Inspection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Check for Windows CRLF in Source Code"
        run: |
          if git grep -I -U $'\r' -- '*.py' '*.sh' '*.yml' '*.html'; then
            echo "Windows CRLF line endings detected!"
            exit 1
          fi
          echo "All source files use Unix LF line endings."

  check-pyproject-toml:
    name: "⚙️ Validate PyProject TOML Specification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Validate TOML Syntax"
        run: |
          python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          assert 'tool' in data, 'Missing [tool] in pyproject.toml'
          assert 'ruff' in data['tool'], 'Missing [tool.ruff]'
          print('pyproject.toml successfully validated!')
          "

  check-json-data-integrity:
    name: "🗃️ JSON Schema & Data Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Validate JSON Files"
        run: |
          python3 -c "
          import json, glob
          targets = glob.glob('data/**/*.json', recursive=True) + glob.glob('docs/*.json')
          for p in targets:
              with open(p, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              assert data is not None, f'Empty JSON in {p}'
          print(f'Successfully verified {len(targets)} JSON files!')
          "

  # =========================================================================
  # 2. Static Typing & Type Safety (Jobs 8-11)
  # =========================================================================
  mypy-core-types:
    name: "🏷️ MyPy Static Type Check: Core Layer"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MyPy on Core"
        run: mypy core/config_models.py core/circuit_breaker.py core/prompt_sanitizer.py core/metrics.py

  mypy-solver-types:
    name: "🏷️ MyPy Static Type Check: Solver & AI Integration"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MyPy on Solver"
        run: mypy services/solver integrations/deepseek.py

  mypy-gamification-types:
    name: "🏷️ MyPy Static Type Check: Gamification Models"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MyPy on Gamification"
        run: mypy services/gamification_models.py services/gamification_registry.py services/achievement_service.py

  mypy-full-configured:
    name: "🏷️ MyPy Project Configuration Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run Configured MyPy"
        run: mypy

  # =========================================================================
  # 3. Security, Vulnerabilities & Secrets (Jobs 12-19)
  # =========================================================================
  security-bandit-core:
    name: "🛡️ Bandit AST Security: Core Framework"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Bandit"
        run: pip install bandit
      - name: "Scan Core Modules"
        run: bandit -r core/

  security-bandit-api:
    name: "🛡️ Bandit AST Security: API Layer"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
