          python-version: "3.12"
      - name: Install MyPy & Pydantic
        run: pip install mypy pydantic
      - name: Run MyPy on Core
        run: mypy core/config_models.py core/circuit_breaker.py core/prompt_sanitizer.py core/metrics.py

  mypy-solver-types:
    name: "🏷️ MyPy Static Type Check: Solver & AI Integration"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MyPy & Dependencies
        run: pip install mypy pydantic aiogram
      - name: Run MyPy on Solver
        run: mypy services/solver integrations/deepseek.py

  mypy-gamification-types:
    name: "🏷️ MyPy Static Type Check: Gamification Models"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
