      - name: Run Full Test Suite on Python 3.12 with XML Coverage
        run: cp .env.ci .env && PYTHONPATH=. pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term:skip-covered
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-report"
          path: coverage.xml

  # =========================================================================
  # 7. Container, Build & Infrastructure (Jobs 40-42)
  # =========================================================================
  docker-compose-validate:
    name: "🐳 Docker Compose Specification Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: |
          cp .env.ci .env
          docker compose config --quiet
          echo "docker-compose.yml configuration valid."

  docker-images-build:
    name: "📦 Docker Multi-Stage Container Build (API, Bot, Worker, Solver)"
    runs-on: ubuntu-latest
    needs: [check-ruff-lint, check-ruff-format, check-function-length]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Build Environment
        run: cp .env.ci .env
      - name: Build All Docker Compose Services
        run: docker compose build --parallel

  docker-trivy-security:
    name: "🛡️ Trivy Container Security Vulnerability Scanner"
    runs-on: ubuntu-latest
    needs: [docker-images-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Build Environment
        run: cp .env.ci .env
      - name: Build API Image for Scanning
        run: docker compose build api
      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'para-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
