name: "CI Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Токен по умолчанию только на чтение: скомпрометированный action или пакет из pip
# не сможет сдвинуть ci-passed (по ней сервер деплоит). Запись — только у deploy-gate
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Quality, Style & Formatting (Jobs 1-7)
  # =========================================================================
  check-ruff-lint:
    name: "🎨 Ruff Linter Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Ruff"
        run: pip install ruff
      - name: "Run Ruff Lint"
        run: ruff check .

  check-ruff-format:
    name: "📐 Ruff Formatting Style Inspection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Ruff"
        run: pip install ruff
      - name: "Verify Code Formatting"
        run: ruff format --check .

  check-function-length:
    name: "📏 Single Responsibility Function Length (<= 25 lines)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Audit Function Length in Gamification & Achievement Services"
        run: |
          python3 -c "
          import ast, sys
          targets = ['services/achievement_service.py', 'services/gamification_models.py']
          errors = []
          for path in targets:
              tree = ast.parse(open(path, 'r', encoding='utf-8').read(), filename=path)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      length = node.end_lineno - node.lineno + 1
                      if length > 25:
                          errors.append(f'{path}:{node.name} length={length} exceeds 25 lines')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All target service functions strictly <= 25 lines!')
          "

  check-docstrings-coverage:
    name: "📝 Module & Public Method Docstrings Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Verify Python Module Docstrings"
        run: |
          python3 -c "
          import ast, glob, sys
          missing = []
          for p in glob.glob('services/**/*.py', recursive=True) + glob.glob('core/*.py'):
              if '__init__' in p or 'conftest' in p: continue
              tree = ast.parse(open(p, 'r', encoding='utf-8').read(), filename=p)
              doc = ast.get_docstring(tree)
              if not doc:
                  missing.append(p)
          if missing:
              print('Missing module docstring in:', missing)
              sys.exit(1)
          print('Module docstrings verified across core and services!')
          "

  check-trailing-whitespace:
    name: "🧹 Git Hygiene & Line Endings Inspection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Check for Windows CRLF in Source Code"
        run: |
          if git grep -I -U $'\r' -- '*.py' '*.sh' '*.yml' '*.html'; then
            echo "Windows CRLF line endings detected!"
            exit 1
          fi
          echo "All source files use Unix LF line endings."

  check-pyproject-toml:
    name: "⚙️ Validate PyProject TOML Specification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Validate TOML Syntax"
        run: |
          python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          assert 'tool' in data, 'Missing [tool] in pyproject.toml'
          assert 'ruff' in data['tool'], 'Missing [tool.ruff]'
          print('pyproject.toml successfully validated!')
          "

  check-json-data-integrity:
    name: "🗃️ JSON Schema & Data Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Validate JSON Files"
        run: |
          python3 -c "
          import json, glob
          targets = glob.glob('data/**/*.json', recursive=True) + glob.glob('docs/*.json')
          for p in targets:
              with open(p, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              assert data is not None, f'Empty JSON in {p}'
          print(f'Successfully verified {len(targets)} JSON files!')
          "

  # =========================================================================
  # 2. Static Typing & Type Safety (Jobs 8-11)
  # =========================================================================
  mypy-core-types:
    name: "🏷️ MyPy Static Type Check: Core Layer"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MyPy on Core"
        run: mypy core/config_models.py core/circuit_breaker.py core/prompt_sanitizer.py core/metrics.py

  mypy-solver-types:
    name: "🏷️ MyPy Static Type Check: Solver & AI Integration"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MyPy on Solver"
        run: mypy services/solver integrations/deepseek.py

  mypy-gamification-types:
    name: "🏷️ MyPy Static Type Check: Gamification Models"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MyPy on Gamification"
        run: mypy services/gamification_models.py services/gamification_registry.py services/achievement_service.py

  mypy-full-configured:
    name: "🏷️ MyPy Project Configuration Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run Configured MyPy"
        run: mypy

  # =========================================================================
  # 3. Security, Vulnerabilities & Secrets (Jobs 12-19)
  # =========================================================================
  security-bandit-core:
    name: "🛡️ Bandit AST Security: Core Framework"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Bandit"
        run: pip install bandit
      - name: "Scan Core Modules"
        run: bandit -r core/

  security-bandit-api:
    name: "🛡️ Bandit AST Security: API Layer"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Bandit"
        run: pip install bandit
      - name: "Scan API Layer"
        run: bandit -r api/

  security-bandit-bot:
    name: "🛡️ Bandit AST Security: Telegram Bot"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Bandit"
        run: pip install bandit
      - name: "Scan Bot Handlers"
        run: bandit -r bot/

  security-bandit-services:
    name: "🛡️ Bandit AST Security: Business Services"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Bandit"
        run: pip install bandit
      - name: "Scan Business Services"
        run: bandit -r services/

  security-pip-audit:
    name: "🔍 Pip-Audit Supply Chain & CVE Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Install Pip-Audit"
        run: pip install pip-audit
      - name: "Run Vulnerability Audit"
        # Lock полностью закреплён с хешами — аудируем список версий без установки
        # (иначе в CI скачиваются гигабайты CUDA-пакетов stt)
        run: pip-audit -r requirements.lock -r requirements-stt.lock --disable-pip --no-deps

  security-secrets-leak:
    name: "🔐 Static Secret & API Token Leakage Prevention"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Scan for Leaked Tokens and Private Keys"
        # `! cmd` под bash -e шаг не валит, поэтому проверка через if. Шаблоны: Google, GitHub, Slack,
        # токен Telegram-бота, ключ DeepSeek, приватные ключи. Сам workflow исключён — в нём шаблоны
        run: |
          PATTERNS='AIza[0-9A-Za-z_-]{35}|ghp_[0-9a-zA-Z]{36}|xoxb-[0-9]{11}-[0-9]{11}|[0-9]{8,10}:AA[0-9A-Za-z_-]{33}|sk-[0-9a-f]{32}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY'
          if git grep -I -n -E "$PATTERNS" -- ':!tests/*' ':!.github/workflows/*'; then
            echo "::error::Leaked secret pattern found in tracked files"
            exit 1
          fi
          echo "Zero leaked secrets detected in tracked files."

  security-sqli-ast:
    name: "💉 SQLite Query Sanitization & SQLi Prevention"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "AST Audit for Formatted SQL Strings"
        run: |
          python3 -c "
          import ast, glob, sys
          violations = []
          for p in glob.glob('db/**/*.py', recursive=True):
              tree = ast.parse(open(p, 'r', encoding='utf-8').read(), filename=p)
              for n in ast.walk(tree):
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == 'execute':
                      if n.args and isinstance(n.args[0], (ast.JoinedStr, ast.BinOp)):
                          violations.append((p, n.lineno))
          if violations:
              print('Unsafe SQL string formatting detected:', violations)
              sys.exit(1)
          print('All database SQL queries parameterized safely!')
          "

  security-session-auth:
    name: "🌐 MiniApp Session & Tester Key Security Boundary"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Verify Cryptographic Auth & Tester Security"
        run: |
          python3 -c "
          content = open('api/deps.py', 'r', encoding='utf-8').read()
          assert 'hmac.compare_digest' in content, 'hmac.compare_digest missing'
          assert 'verify_tester_session' in content, 'verify_tester_session missing'
          print('API Session & Tester Key Security Boundary verified!')
          "

  # =========================================================================
  # 4. Architecture, Documentation Drift & Contracts (Jobs 20-25)
  # =========================================================================
  arch-openapi-drift:
    name: "📄 API Contract Drift Check: OpenAPI Specification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: "Verify Zero OpenAPI Spec Drift"
        run: |
          cp .env.ci .env
          PYTHONPATH=. python3 -c "import json; from api import create_app; open('docs/openapi.json', 'w').write(json.dumps(create_app().openapi(), indent=2) + '\n')"
          git diff --exit-code docs/openapi.json

  arch-docs-suite-drift:
    name: "📚 Documentation Suite & Index Markdown Drift Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run Docs Generator & Check Drift"
        run: |
          cp .env.ci .env
          python3 scripts/generate_docs_suite.py
          git diff --exit-code docs/

  arch-uml-diagram-drift:
    name: "📊 UML Architecture Specification & Mermaid Sync"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Verify UML Specification File"
        run: |
          test -f docs/UML.md
          grep -q "mermaid" docs/UML.md
          grep -q "AchievementService" docs/UML.md
          echo "docs/UML.md architecture specification confirmed."

  arch-layer-isolation:
    name: "🧱 Clean Architecture Layer Boundary & Cyclic Imports"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Audit Clean Architecture Layer Violations"
        run: |
          python3 -c "
          import glob, sys
          violations = []
          for p in glob.glob('core/*.py'):
              content = open(p).read()
              if 'from api ' in content or 'from bot ' in content:
                  violations.append(f'{p} imports from higher layer (api/bot)')
          if violations:
              print('Architecture layer violations:', violations)
              sys.exit(1)
          print('Clean architecture layer boundaries preserved!')
          "

  arch-env-schema-parity:
    name: "⚙️ Environment Variables & Config Schema Parity"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "Verify Config Schema against .env.ci"
        run: |
          python3 -c "
          with open('.env.ci', 'r', encoding='utf-8') as f:
              ci_keys = {line.split('=')[0].strip() for line in f if '=' in line and not line.strip().startswith('#')}
          assert len(ci_keys) > 10, 'Expected at least 10 environment keys in .env.ci'
          print(f'Config schema verified: {len(ci_keys)} keys found in .env.ci!')
          "

  arch-requirements-parity:
    name: "📦 Production & Dev Requirements Compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Verify Requirements Files Exist"
        run: |
          test -f requirements.txt
          test -f requirements-dev.txt
          echo "Requirements configuration validated."

  # =========================================================================
  # 5. Unit & Subsystem Tests (Jobs 26-37)
  # =========================================================================
  unit-test-achievement-service:
    name: "🧪 Unit: Achievement Engine & Instant Telegram Push"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run Achievement Service Tests"
        run: cp .env.ci .env && PYTHONPATH=. pytest tests/test_achievement_service.py -v

  unit-test-gamification-rules:
    name: "🧪 Unit: Gamification Rules, Profiles & Ranks"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run Gamification Tests"
        run: cp .env.ci .env && PYTHONPATH=. pytest tests/test_gamification.py -v

  unit-test-miniapp-and-testers:
    name: "🧪 Unit: MiniApp Cryptographic Auth & Tester Whitelist"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Run MiniApp & Testers Tests"
        run: cp .env.ci .env && PYTHONPATH=. pytest tests/test_miniapp_and_testers.py -v

  unit-test-attendance-system:
    name: "🧪 Unit: WOPI Attendance & Topic Stats"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
