  check-function-length-all:
    name: "📏 Function Length ≤ 25 Lines (Whole Project)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Audit Function Bodies"
        # Тело без docstring, как в правилах проекта; сгенерированные *_pb2 и тесты не проверяем
        run: |
          python3 -c "
          import ast, subprocess, sys
          files = [f for f in subprocess.run(['git', 'ls-files', '*.py'], capture_output=True, text=True).stdout.split()
                   if not f.startswith('tests/') and '_pb2' not in f]
          errors = []
          for path in files:
              for node in ast.walk(ast.parse(open(path, encoding='utf-8').read(), filename=path)):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  body = node.body[1:] if ast.get_docstring(node) else node.body
                  if body and body[-1].end_lineno - body[0].lineno + 1 > 25:
                      errors.append(f'{path}:{node.lineno} {node.name}')
          if errors:
              print('Functions longer than 25 lines:', *errors, sep='\n  ')
              sys.exit(1)
          print(f'All functions in {len(files)} files are <= 25 lines')
          "

