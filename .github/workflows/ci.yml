        run: cp .env.ci .env && PYTHONPATH=. pytest tests/ -q

  matrix-test-python-312:
    name: "🐍 Full Test Matrix: Python 3.12 + Coverage Report"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
