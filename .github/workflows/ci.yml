  security-detect-secrets:
    name: "🕵️ Detect-Secrets: Baseline Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Detect-Secrets"
        run: pip install detect-secrets==1.5.0
      - name: "Compare Fresh Scan Against Baseline"
        # Сравниваем пары (файл, хеш секрета), а не номера строк: detect-secrets-hook валится,
        # даже когда известная строка просто сдвинулась. Ложное срабатывание — обновить baseline:
        # detect-secrets scan --baseline .secrets.baseline
        run: |
          # Обновляем baseline на месте: так сохраняются его фильтры (exclude) и он не сканирует сам себя
          cp .secrets.baseline /tmp/committed.baseline
          detect-secrets scan --baseline .secrets.baseline
          python3 -c "
          import json, sys
          def keys(path):
              data = json.load(open(path))['results']
              return {(f, s['hashed_secret']) for f, items in data.items() for s in items}
          new = keys('.secrets.baseline') - keys('/tmp/committed.baseline')
          if new:
              print('Secrets not in .secrets.baseline:', *sorted(f for f, _ in new), sep='\\n  ')
              sys.exit(1)
          print('No new secrets outside the baseline')
          "

  arch-module-imports:
    name: "🔄 Standalone Module Imports & Circular Import Detection"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: "Install Dependencies"
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Import Every Module in a Fresh Interpreter"
        # Каждый модуль — в своём процессе: цикл импорта, скрытый порядком загрузки, тут проявится
        run: |
          cp .env.ci .env
          git ls-files '*.py' | grep -vE '^(tests|scripts)/|_pb2|__init__\.py$' | sed 's/\.py$//; s|/|.|g' \
            | xargs -P "$(nproc)" -I{} sh -c 'PYTHONPATH=. python -c "import importlib; importlib.import_module(\"{}\")" >/dev/null 2>&1 || { echo "FAIL {}"; exit 255; }'
          echo "All modules import standalone"

