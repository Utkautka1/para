  # 7. Container, Build & Infrastructure (Jobs 40-42)
  # =========================================================================
  docker-compose-validate:
    name: "🐳 Docker Compose Specification Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Validate Docker Compose Configuration"
        run: |
          cp .env.ci .env
          docker compose config --quiet
          echo "docker-compose.yml configuration valid."

  docker-images-build:
    name: "📦 Docker Multi-Stage Container Build (API, Bot, Worker, Solver)"
    runs-on: ubuntu-latest
    needs: [check-ruff-lint, check-ruff-format, check-function-length]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: "Prepare Build Environment"
        run: cp .env.ci .env
      - name: "Build All Docker Compose Services"
        run: docker compose build --parallel

  docker-trivy-security:
    name: "🛡️ Trivy Container Security Vulnerability Scanner"
    runs-on: ubuntu-latest
    needs: [docker-images-build]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: "Prepare Build Environment"
        run: cp .env.ci .env
      - name: "Build API Image for Scanning"
        run: docker compose build api
      - name: "Run Trivy Scanner"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'para-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # =========================================================================
  # Deploy gate: ветка ci-passed указывает на последний коммит main,
  # прошедший ВСЕ джобы. Сервер сам опрашивает её (scripts/autodeploy.sh)
  # и деплоит — GitHub не получает ни ssh-ключей, ни доступа к серверу.
  # =========================================================================
  deploy-gate:
    name: "🚀 Deploy Gate: mark commit as deployable"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - check-ruff-lint
      - check-ruff-format
      - check-function-length
      - check-docstrings-coverage
      - check-trailing-whitespace
      - check-pyproject-toml
      - check-json-data-integrity
      - mypy-core-types
      - mypy-solver-types
      - mypy-gamification-types
      - mypy-full-configured
      - security-bandit-core
      - security-bandit-api
      - security-bandit-bot
      - security-bandit-services
      - security-pip-audit
      - security-secrets-leak
      - security-sqli-ast
      - security-session-auth
      - arch-openapi-drift
      - arch-docs-suite-drift
      - arch-uml-diagram-drift
      - arch-layer-isolation
      - arch-env-schema-parity
      - arch-requirements-parity
      - unit-test-achievement-service
      - unit-test-gamification-rules
      - unit-test-miniapp-and-testers
      - unit-test-attendance-system
      - unit-test-bot-schedule-commands
      - unit-test-auth-and-access-filters
      - unit-test-sqlite-database
      - unit-test-ai-solver-resilience
      - unit-test-observability-jaeger
      - unit-test-grpc-services
      - unit-test-voice-transcription
      - unit-test-yandex-wopi-sync
      - matrix-test-python-311
      - matrix-test-python-312
      - docker-compose-validate
      - docker-images-build
      - docker-trivy-security
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: "Move ci-passed to this commit"
        run: git push --force origin "HEAD:refs/heads/ci-passed"
