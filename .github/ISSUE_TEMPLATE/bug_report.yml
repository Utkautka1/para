name: "🐛 Bug Report"
description: "Submit a structured defect report for Para microservices"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **Para**. Please fill in the details below to help us reproduce and resolve the defect quickly.

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      description: Which service or subsystem is failing?
      options:
        - "para-bot (Telegram Ingress & Handlers)"
        - "para-api (FastAPI REST & gRPC Mesh)"
        - "para-worker (APScheduler & Telemetry Daemon)"
        - "para-solver (DeepSeek AI Homework Queue)"
        - "para-redis (L2 Storage & FSM Bus)"
        - "WOPI / Yandex Docs Integration"
        - "CI/CD & Developer Tooling"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Defect Description
      description: Provide a clear and concise description of what the unexpected behavior is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or API request to trigger the bug.
      placeholder: |
        1. Open Telegram bot / send command /attendance
        2. Click button 'Present' for student N
        3. Observe timeout error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Structured Logs / Traceback
      description: Paste relevant log output or stack traces from Docker containers.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: "I have confirmed this issue is not already reported."
          required: true
        - label: "I have verified that all 546 unit tests pass on my branch."
          required: false
