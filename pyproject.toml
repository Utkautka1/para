[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = [
    "E402",    # Module level import not at top of file (used for deferred circular import guards)
    "E501",    # Line too long (handled by formatting / long test mocks)
    "E741",    # Ambiguous variable name (e.g. l for lesson in tests)
    "B008",    # FastAPI Depends, Query, and Security in argument defaults
    "BLE001",  # Broad exception catching (used for process resilience)
    "RUF001",  # Ambiguous unicode characters in string literals (Cyrillic support)
    "RUF002",  # Ambiguous unicode characters in docstrings (Cyrillic support)
    "RUF003",  # Ambiguous unicode characters in comments (Cyrillic support)
    "RUF006",  # Store a reference to asyncio.create_task (fire-and-forget tasks)
    "UP038",   # Use X | Y in isinstance call (tuple is faster in CPython runtime)
]

[tool.ruff.lint.isort]
known-first-party = ["api", "bot", "core", "db", "integrations", "services", "utils", "config"]
